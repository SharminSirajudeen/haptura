[project]
name = "haptura"
version = "0.0.0"
description = "A gate that makes an agent prove, by its own experiments, that it still controls what it is about to act on."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.5,<3",
  "openai>=2.54,<3",
]

[dependency-groups]
dev = [
  "pytest>=9.2,<10",
  "ruff>=0.17.3,<0.18",
  "mypy>=2.4,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gate", "phone"]

[tool.ruff]
target-version = "py313"
line-length = 100
# PLR1702 (nesting) exists only in preview; without this line it is silently off. A test proves it is on.
preview = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90", "PLR0915", "PLR1702", "S110"]
explicit-preview-rules = true
mccabe.max-complexity = 10
pylint.max-nested-blocks = 3
pylint.max-statements = 40

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = "-ra -p no:cacheprovider"

[tool.mypy]
strict = true
python_version = "3.13"
files = ["gate", "phone", "tests"]
