<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>control-gate demo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>control-gate</h1>
  <p>Two panes play one episode. Each box is a tracked element and says what the agent believes about it.</p>
  <p class="note">Placeholder data: a hand-written episode over a test pattern, not a result.</p>
</header>
<noscript><p>This page needs JavaScript to draw its labels.</p></noscript>
<main></main>
<template id="pane">
  <section class="pane">
    <h2></h2>
    <div class="stage">
      <video muted playsinline preload="auto"></video>
      <canvas aria-hidden="true"></canvas>
    </div>
    <div class="bar">
      <button type="button" class="play">Play</button>
      <input class="scrub" type="range" min="0" max="0" step="0.1" value="0" aria-label="Position in the episode">
    </div>
    <div class="caption">
      <p class="where"></p>
      <p class="fix"></p>
      <p class="advice"></p>
      <p class="decision"></p>
    </div>
    <ul class="labels"></ul>
  </section>
</template>
<script src="app.js"></script>
</body>
</html>
